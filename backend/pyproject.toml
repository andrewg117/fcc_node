[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "andrewg117", email = "andrewjgrant7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi==0.141.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pwdlib[argon2]==0.3.1",
    "pydantic[email]==2.13.5",
    "pyjwt==2.14.0",
    "python-dotenv==1.2.3",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn==0.52.4",
]

[project.scripts]
backend = "backend.main:run"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]
